<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cyberpunk Bomberman 2088</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tajawal', 'Orbitron', sans-serif;
            background-color: #05060d;
            background-image: radial-gradient(circle at 50% -10%, rgba(0, 243, 255, 0.12), transparent 42%), radial-gradient(circle at 10% 100%, rgba(255, 0, 127, 0.08), transparent 35%);
            color: #ffffff;
            overflow: hidden;
        }
        .neon-border-cyan {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            border: 2px solid #00f3ff;
        }
        .neon-text-magenta {
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
        }
        .neon-text-cyan {
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
        }
        .neon-button {
            background: linear-gradient(135deg, rgba(255,0,127,0.2), rgba(0,243,255,0.2));
            transition: all 0.2s ease-in-out;
        }
        .neon-button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 25px rgba(0,243,255,0.6);
        }
        .neon-button:active {
            transform: translateY(1px);
        }
        #gameCanvas {
            display: block;
            width: min(100%, 720px);
            height: auto;
            aspect-ratio: 15 / 11;
            image-rendering: pixelated;
            border-radius: 16px;
            background: #05060d;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.16), inset 0 0 35px rgba(255, 0, 127, 0.08);
        }
        #canvas-wrapper {
            border-radius: 18px;
            background: radial-gradient(circle, rgba(15, 23, 42, 0.34), transparent 68%);
        }
        .touch-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 243, 255, 0.3);
            backdrop-filter: blur(4px);
            touch-action: none;
        }
        .touch-btn:active {
            background: rgba(0, 243, 255, 0.4);
        }

        /* Phone layout: keep the arena and controls inside the visible viewport. */
        @media (max-width: 767px) {
            body {
                width: 100%;
                min-height: 100dvh;
                padding: max(0.5rem, env(safe-area-inset-top)) max(0.5rem, env(safe-area-inset-left)) max(0.5rem, env(safe-area-inset-bottom)) max(0.5rem, env(safe-area-inset-right)) !important;
                overflow: hidden;
            }

            header {
                flex: 0 0 auto;
                width: 100%;
                min-height: 48px;
                padding: 0.4rem 0.6rem !important;
                margin-bottom: 0.35rem !important;
                border-width: 1px;
            }

            header > div:first-child {
                min-width: 0;
                gap: 0.45rem;
            }

            header > div:first-child > i {
                font-size: 1rem;
            }

            header h1 {
                font-size: clamp(0.82rem, 4vw, 1.05rem);
                line-height: 1.1;
                white-space: nowrap;
            }

            header > div:last-child {
                gap: 0.25rem;
                font-size: 0.68rem;
            }

            header > div:last-child > div {
                padding: 0.3rem 0.4rem;
            }

            main {
                width: 100%;
                max-width: none;
                min-height: 0;
                flex: 1 1 auto;
                justify-content: flex-start !important;
                gap: 0.35rem;
            }

            #canvas-wrapper {
                width: 100%;
                height: auto !important;
                min-height: 0;
                flex: 0 1 auto;
                padding: 0;
            }

            #gameCanvas {
                width: 100%;
                max-width: 100%;
                max-height: calc(100dvh - 230px);
                height: auto;
                border-radius: 12px;
            }

            #modal-overlay {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100dvh;
                padding: 0.75rem;
                border-radius: 0;
            }

            #modal-overlay > div {
                width: min(100%, 28rem);
                max-height: calc(100dvh - 1.5rem);
                overflow: auto;
                overflow-x: hidden;
                padding: 1rem;
                gap: 0.75rem;
                border-radius: 14px;
            }

            #modal-icon {
                font-size: 2.5rem;
            }

            #modal-title {
                font-size: clamp(1.15rem, 6vw, 1.65rem);
                line-height: 1.25;
            }

            #modal-msg {
                font-size: 0.78rem;
            }

            #mobile-controls {
                width: 100%;
                max-width: none;
                min-height: 0;
                flex: 0 0 auto;
                margin-top: 0 !important;
                padding: 0.15rem 0.25rem max(0.15rem, env(safe-area-inset-bottom)) !important;
                align-items: center;
            }

            #mobile-controls > div:first-child {
                width: clamp(8.5rem, 38vw, 10rem);
                height: clamp(8.5rem, 38vw, 10rem);
            }

            #mobile-controls .touch-btn {
                min-width: 2.75rem;
                min-height: 2.75rem;
                font-size: 1rem;
                -webkit-tap-highlight-color: transparent;
            }

            #btn-bomb {
                width: clamp(4.25rem, 21vw, 5.25rem) !important;
                height: clamp(4.25rem, 21vw, 5.25rem) !important;
                flex: 0 0 auto;
            }
        }

        @media (max-width: 480px) {
            header {
                flex-wrap: wrap;
                row-gap: 0.25rem;
            }

            header > div:first-child,
            header > div:last-child {
                flex: 1 1 100%;
                width: 100%;
            }

            header > div:last-child {
                justify-content: space-between;
            }
        }

        @media (max-width: 360px) {
            header > div:first-child > i {
                display: none;
            }

            header > div:last-child > div {
                padding-left: 0.25rem;
                padding-right: 0.25rem;
            }

            #gameCanvas {
                max-height: calc(100dvh - 210px);
            }

            #mobile-controls > div:first-child {
                width: 8rem;
                height: 8rem;
            }
        }

        @media (max-width: 767px) and (max-height: 520px) {
            header {
                min-height: 40px;
                padding-top: 0.25rem !important;
                padding-bottom: 0.25rem !important;
            }

            #gameCanvas {
                max-height: calc(100dvh - 155px);
            }

            #mobile-controls > div:first-child {
                width: 7rem;
                height: 7rem;
            }

            #btn-bomb {
                width: 4rem !important;
                height: 4rem !important;
            }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen bg-slate-950 text-white select-none p-2 md:p-4">

    <!-- Top Header & HUD -->
    <header class="w-full max-w-4xl flex items-center justify-between px-4 py-2 bg-slate-900/80 backdrop-blur-md rounded-xl neon-border-cyan mb-2">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-bomb text-cyan-400 text-2xl animate-pulse"></i>
            <div>
                <h1 class="font-black text-lg md:text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 font-['Orbitron']">
                    NEON BOMBERMAN
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">اصدار الأسطورة - 600 عام خبرة</p>
            </div>
        </div>

        <!-- Live Scoreboard -->
        <div class="flex items-center gap-4 text-xs md:text-sm font-bold">
            <div class="flex items-center gap-1 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-pink-500/30">
                <i class="fa-solid fa-heart text-pink-500"></i>
                <span id="hud-lives" class="text-pink-400">3</span>
            </div>
            <div class="flex items-center gap-1 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-yellow-500/30">
                <i class="fa-solid fa-trophy text-yellow-400"></i>
                <span id="hud-score" class="text-yellow-400">0000</span>
            </div>
            <div class="flex items-center gap-1 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-cyan-500/30">
                <i class="fa-solid fa-layer-group text-cyan-400"></i>
                <span id="hud-level" class="text-cyan-400">المستوى 1</span>
            </div>
        </div>
    </header>

    <!-- Game Container & Canvas Frame -->
    <main class="relative w-full max-w-4xl flex-1 flex flex-col items-center justify-center min-h-0">
        <div id="canvas-wrapper" class="relative flex items-center justify-center w-full h-full p-1">
            <canvas id="gameCanvas" class="shadow-2xl max-w-full max-h-full"></canvas>

            <!-- Overlay Screen: Start / Game Over / Win -->
            <div id="modal-overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-lg flex flex-col items-center justify-center p-6 text-center rounded-xl z-20 transition-all duration-300">
                <div class="max-w-md w-full bg-slate-900/90 p-8 rounded-2xl border border-cyan-500/40 shadow-2xl space-y-6">
                    <div id="modal-icon" class="text-6xl text-cyan-400 animate-bounce">
                        <i class="fa-solid fa-gamepad"></i>
                    </div>
                    <h2 id="modal-title" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400">
                        NEON BOMBERMAN 2088
                    </h2>
                    <p id="modal-msg" class="text-slate-300 text-sm leading-relaxed">
                        اخترق الشبكة، ضع القنابل السايبرانية، ودمّر الأعداء للوصول إلى النواة!
                    </p>

                    <!-- Instructions Grid -->
                    <div class="grid grid-cols-2 gap-2 text-xs text-slate-400 bg-slate-950/60 p-3 rounded-lg border border-slate-800 text-right">
                        <div><i class="fa-solid fa-keyboard text-cyan-400 ml-1"></i> الحركة: <b>الأسهم / WASD</b></div>
                        <div><i class="fa-solid fa-space-shuttle text-pink-400 ml-1"></i> قنبلة: <b>المسطرة Space</b></div>
                        <div><i class="fa-solid fa-bolt text-yellow-400 ml-1"></i> الجوائز: <b>نطاق، قنابل، سرعة</b></div>
                        <div><i class="fa-solid fa-shield text-emerald-400 ml-1"></i> الهدف: <b>تصفية الأعداء</b></div>
                    </div>

                    <button id="btn-start" class="w-full py-4 text-lg font-bold rounded-xl neon-button text-cyan-300 border border-cyan-400/50 shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-play"></i>
                        <span>ابدأ اللعب الآن</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Controls (Visible on Touch Devices) -->
        <div id="mobile-controls" class="w-full max-w-lg mt-2 flex items-center justify-between px-4 pb-2 md:hidden">
            <!-- D-Pad Grid -->
            <div class="grid grid-cols-3 gap-1.5 w-36 h-36">
                <div></div>
                <button id="btn-up" class="touch-btn rounded-t-xl flex items-center justify-center text-cyan-400 text-xl"><i class="fa-solid fa-chevron-up"></i></button>
                <div></div>
                <button id="btn-left" class="touch-btn rounded-l-xl flex items-center justify-center text-cyan-400 text-xl"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="bg-slate-900/50 rounded-md"></div>
                <button id="btn-right" class="touch-btn rounded-r-xl flex items-center justify-center text-cyan-400 text-xl"><i class="fa-solid fa-chevron-right"></i></button>
                <div></div>
                <button id="btn-down" class="touch-btn rounded-b-xl flex items-center justify-center text-cyan-400 text-xl"><i class="fa-solid fa-chevron-down"></i></button>
                <div></div>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-3">
                <button id="btn-bomb" class="w-20 h-20 rounded-full bg-gradient-to-tr from-pink-600 to-rose-400 border-2 border-pink-300 shadow-lg flex flex-col items-center justify-center active:scale-95 text-white">
                    <i class="fa-solid fa-bomb text-2xl"></i>
                    <span class="text-[10px] font-bold mt-1">قنبلة</span>
                </button>
            </div>
        </div>
    </main>

    <script>
        /* Modern Web Audio Synthesizer for Retro SFX (Zero external files needed) */
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.enabled = false;
            }
            init() {
                try {
                    if (!this.ctx) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (!AudioContext) return;
                        this.ctx = new AudioContext();
                    }
                    this.enabled = true;
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                } catch (error) {
                    this.enabled = false;
                }
            }
            playTone(freq, type, duration, vol = 0.1) {
                if (!this.ctx || !this.enabled) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playExplosion() {
                if (!this.ctx || !this.enabled) return;
                try {
                    const bufferSize = this.ctx.sampleRate * 0.4;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const whiteNoise = this.ctx.createBufferSource();
                    whiteNoise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.4);

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);

                    whiteNoise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    whiteNoise.start();
                } catch(e) {}
            }
            sfxPlantBomb() {
                this.playTone(300, 'sine', 0.15, 0.2);
            }
            sfxPowerup() {
                this.playTone(523, 'triangle', 0.1, 0.2);
                setTimeout(() => this.playTone(659, 'triangle', 0.1, 0.2), 80);
                setTimeout(() => this.playTone(783, 'triangle', 0.15, 0.2), 160);
            }
            sfxHit() {
                this.playTone(150, 'sawtooth', 0.3, 0.3);
            }
            sfxWin() {
                [440, 554, 659, 880].forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'sine', 0.2, 0.2), idx * 120);
                });
            }
        }

        const audio = new AudioEngine();

        // Game Grid Constants (15 cols x 11 rows)
        const COLS = 15;
        const ROWS = 11;
        const TILE_SIZE = 48; // Base resolution per tile

        const TILE_EMPTY = 0;
        const TILE_WALL = 1;     // Indestructible Obsidian Block
        const TILE_BRICK = 2;    // Destructible Cyber Block

        const POWERUP_BOMB = 'bomb';
        const POWERUP_FLAME = 'flame';
        const POWERUP_SPEED = 'speed';
        const POWERUP_SHIELD = 'shield';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = COLS * TILE_SIZE;
        canvas.height = ROWS * TILE_SIZE;

        // State Machine
        let gameState = 'START'; // START, PLAYING, WIN, GAMEOVER
        let score = 0;
        let level = 1;
        let lives = 3;
        let screenShake = 0;
        let screenFlash = 0;
        let screenFlashColor = '#ffffff';
        let ambientTime = 0;
        let combo = 0;
        let comboTimer = 0;
        let floatingTexts = [];

        // Entities arrays
        let grid = [];
        let player = null;
        let enemies = [];
        let bombs = [];
        let explosions = [];
        let powerups = [];
        let particles = [];

        function emitBurst(x, y, color, count = 8, options = {}) {
            for (let i = 0; i < count; i++) {
                const particle = new Particle(x, y, color, options);
                particle.vx += options.vx || 0;
                particle.vy += options.vy || 0;
                particles.push(particle);
            }
        }

        function addImpactFlash(color = '#ffffff', strength = 0.6) {
            screenFlashColor = color;
            screenFlash = Math.max(screenFlash, strength);
        }

        function addFloatingText(x, y, text, color = '#ffffff') {
            floatingTexts.push({ x, y, text, color, life: 0.9, maxLife: 0.9 });
        }

        class Particle {
            constructor(x, y, color, options = {}) {
                this.x = x;
                this.y = y;
                const speed = options.speed ?? 180;
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * speed * (0.45 + Math.random() * 0.75);
                this.vy = Math.sin(angle) * speed * (0.45 + Math.random() * 0.75);
                this.size = options.size ?? (Math.random() * 5 + 2);
                this.color = color;
                this.alpha = 1;
                this.life = options.life ?? (Math.random() * 0.3 + 0.35);
                this.gravity = options.gravity ?? 90;
                this.drag = options.drag ?? 0.91;
            }
            update(dt) {
                this.vx *= Math.pow(this.drag, dt * 60);
                this.vy = this.vy * Math.pow(this.drag, dt * 60) + this.gravity * dt;
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.alpha -= dt / this.life;
            }
            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * (0.7 + this.alpha * 0.3), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Player {
            constructor() {
                this.resetPosition();
                this.maxBombs = 1;
                this.flameRange = 1;
                this.speed = 190; // Pixels per second; frame-rate independent
                this.invincibleTimer = 0;
                this.hasShield = false;
                this.radius = TILE_SIZE * 0.38;
                this.trailTimer = 0;
                this.autoEscapeTarget = null;
                this.bombSafetyTimer = 0;
            }
            resetPosition() {
                this.x = 1.5 * TILE_SIZE;
                this.y = 1.5 * TILE_SIZE;
            }
            getTile() {
                return {
                    col: Math.floor(this.x / TILE_SIZE),
                    row: Math.floor(this.y / TILE_SIZE)
                };
            }
            update(keys, dt) {
                if (this.invincibleTimer > 0) this.invincibleTimer -= dt;
                if (this.bombSafetyTimer > 0) this.bombSafetyTimer -= dt;
                this.trailTimer -= dt;

                let dx = 0;
                let dy = 0;

                if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
                if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
                if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
                if (keys['ArrowRight'] || keys['KeyD']) dx += 1;

                const hasManualInput = dx !== 0 || dy !== 0;
                if (hasManualInput) {
                    // Manual input always takes priority over the safety assist.
                    this.autoEscapeTarget = null;
                } else if (this.autoEscapeTarget) {
                    const targetX = (this.autoEscapeTarget.col + 0.5) * TILE_SIZE;
                    const targetY = (this.autoEscapeTarget.row + 0.5) * TILE_SIZE;
                    const distanceX = targetX - this.x;
                    const distanceY = targetY - this.y;
                    if (Math.abs(distanceX) < 4 && Math.abs(distanceY) < 4) {
                        this.autoEscapeTarget = null;
                    } else {
                        if (Math.abs(distanceX) > 3) dx = Math.sign(distanceX);
                        if (Math.abs(distanceY) > 3) dy = Math.sign(distanceY);
                    }
                }

                // Normalize diagonal movement speed
                if (dx !== 0 && dy !== 0) {
                    dx *= 0.7071;
                    dy *= 0.7071;
                }

                // Move with collision checking using seconds, not frames.
                this.moveAxis(dx * this.speed * dt, 0);
                this.moveAxis(0, dy * this.speed * dt);

                if ((dx !== 0 || dy !== 0) && this.trailTimer <= 0) {
                    emitBurst(this.x - dx * this.radius * 0.55, this.y - dy * this.radius * 0.55, '#00f3ff', 1, {
                        speed: 28,
                        size: 2.5,
                        life: 0.22,
                        gravity: 0,
                        drag: 0.96
                    });
                    this.trailTimer = 0.045;
                }
            }

            moveAxis(dx, dy) {
                if (dx === 0 && dy === 0) return;
                const newX = this.x + dx;
                const newY = this.y + dy;

                if (!this.checkCollision(newX, newY)) {
                    this.x = newX;
                    this.y = newY;
                }
            }

            checkCollision(nx, ny) {
                const r = this.radius - 2;
                // Check 4 corners around player bounding circle
                const points = [
                    { x: nx - r, y: ny - r },
                    { x: nx + r, y: ny - r },
                    { x: nx - r, y: ny + r },
                    { x: nx + r, y: ny + r }
                ];

                for (let p of points) {
                    let col = Math.floor(p.x / TILE_SIZE);
                    let row = Math.floor(p.y / TILE_SIZE);

                    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return true;

                    let tile = grid[row][col];
                    if (tile === TILE_WALL || tile === TILE_BRICK) return true;

                    // Bomb collision (can pass through bomb if standing on it when placed)
                    for (let b of bombs) {
                        if (b.col === col && b.row === row) {
                            let pTile = this.getTile();
                            // If player was already inside bomb tile, allow walking out, else block
                            if (pTile.col !== b.col || pTile.row !== b.row) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            draw(ctx) {
                if (this.invincibleTimer > 0 && Math.floor(Date.now() / 100) % 2 === 0) return;

                ctx.save();
                ctx.translate(this.x, this.y);

                const pulse = 1 + Math.sin(ambientTime * 7) * 0.05;
                ctx.strokeStyle = 'rgba(0, 243, 255, 0.22)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 1.22 * pulse, 0, Math.PI * 2);
                ctx.stroke();

                // Shield visual
                if (this.hasShield) {
                    ctx.strokeStyle = '#00f3ff';
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#00f3ff';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius + 4, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Player Body (Cyberpunk Neon Orb/Helmet)
                ctx.fillStyle = '#00f3ff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00f3ff';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Helmet Visor
                ctx.fillStyle = '#ff007f';
                ctx.beginPath();
                ctx.ellipse(3, -2, this.radius * 0.5, this.radius * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Enemy {
            constructor(col, row, type = 'basic') {
                this.x = (col + 0.5) * TILE_SIZE;
                this.y = (row + 0.5) * TILE_SIZE;
                this.type = type; // basic, fast, ghost
                this.speed = type === 'fast' ? 138 : 84; // Pixels per second
                this.dir = { x: 1, y: 0 };
                this.changeDirTimer = 0;
                this.radius = TILE_SIZE * 0.36;
                this.color = type === 'fast' ? '#ffaa00' : (type === 'ghost' ? '#a855f7' : '#ff0055');
                this.phase = Math.random() * Math.PI * 2;
            }
            getTile() {
                return {
                    col: Math.floor(this.x / TILE_SIZE),
                    row: Math.floor(this.y / TILE_SIZE)
                };
            }
            update(dt) {
                this.changeDirTimer -= dt;
                this.phase += dt * 5;

                let nextX = this.x + this.dir.x * this.speed * dt;
                let nextY = this.y + this.dir.y * this.speed * dt;

                if (this.checkCollision(nextX, nextY) || this.changeDirTimer <= 0) {
                    this.chooseNewDirection();
                    this.changeDirTimer = Math.random() * 2 + 1;
                } else {
                    this.x = nextX;
                    this.y = nextY;
                }
            }
            chooseNewDirection() {
                const dirs = [{x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}];
                const validDirs = dirs.filter(d => !this.checkCollision(this.x + d.x * TILE_SIZE * 0.5, this.y + d.y * TILE_SIZE * 0.5));
                if (validDirs.length > 0) {
                    this.dir = validDirs[Math.floor(Math.random() * validDirs.length)];
                } else {
                    this.dir = { x: -this.dir.x, y: -this.dir.y };
                }
            }
            checkCollision(nx, ny) {
                let col = Math.floor(nx / TILE_SIZE);
                let row = Math.floor(ny / TILE_SIZE);

                if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return true;

                let tile = grid[row][col];
                if (tile === TILE_WALL) return true;
                if (tile === TILE_BRICK && this.type !== 'ghost') return true;

                // Avoid bombs
                for (let b of bombs) {
                    if (b.col === col && b.row === row) return true;
                }
                return false;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.globalAlpha = this.type === 'ghost' ? 0.72 + Math.sin(this.phase) * 0.18 : 1;

                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;

                // Enemy Body (Cyber Drone Shape)
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Eye / Sensor
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.dir.x * 4, this.dir.y * 4, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Bomb {
            constructor(col, row, range, owner) {
                this.col = col;
                this.row = row;
                this.range = range;
                this.owner = owner;
                this.timer = 2.5; // seconds until explosion
                this.pulse = 0;
                this.age = 0;
                this.sparkTimer = 0;
            }
            update(dt) {
                this.timer -= dt;
                this.age += dt;
                this.pulse += dt * 8;
                this.sparkTimer -= dt;
                // Fuse particle sparks at a stable rate on every refresh rate.
                if (this.sparkTimer <= 0) {
                    emitBurst((this.col + 0.5) * TILE_SIZE, (this.row + 0.18) * TILE_SIZE, '#ffaa00', 1, {
                        speed: 55,
                        size: 2.2,
                        life: 0.28,
                        gravity: 35
                    });
                    this.sparkTimer = 0.075;
                }
                return this.timer <= 0;
            }
            draw(ctx) {
                let x = (this.col + 0.5) * TILE_SIZE;
                let y = (this.row + 0.5) * TILE_SIZE;
                let scale = 1 + Math.sin(this.pulse) * 0.08;

                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);

                const urgency = 1 - Math.max(0, this.timer) / 2.5;
                ctx.strokeStyle = `rgba(255, 170, 0, ${0.25 + urgency * 0.65})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, TILE_SIZE * (0.43 + Math.sin(this.age * 10) * 0.035), 0, Math.PI * 2);
                ctx.stroke();

                // Glowing bomb core
                ctx.fillStyle = '#ff0055';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff0055';
                ctx.beginPath();
                ctx.arc(0, 2, TILE_SIZE * 0.35, 0, Math.PI * 2);
                ctx.fill();

                // Bomb cap & spark
                ctx.fillStyle = '#ffee00';
                ctx.fillRect(-3, -TILE_SIZE * 0.4, 6, 6);

                ctx.restore();
            }
        }

        class ExplosionCell {
            constructor(col, row) {
                this.col = col;
                this.row = row;
                this.duration = 0.48;
                this.life = this.duration;
                this.age = 0;
                this.particleTimer = 0;
            }
            update(dt) {
                this.life -= dt;
                this.age += dt;
                this.particleTimer -= dt;
                if (this.particleTimer <= 0) {
                    emitBurst(
                        (this.col + 0.5) * TILE_SIZE,
                        (this.row + 0.5) * TILE_SIZE,
                        Math.random() > 0.5 ? '#ffaa00' : '#ff0055',
                        2,
                        { speed: 120, size: 2.8, life: 0.24, gravity: 20 }
                    );
                    this.particleTimer = 0.055;
                }
                return this.life <= 0;
            }
            draw(ctx) {
                const x = this.col * TILE_SIZE;
                const y = this.row * TILE_SIZE;
                const progress = 1 - Math.max(0, this.life) / this.duration;
                const alpha = 1 - progress * 0.55;

                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.globalAlpha = alpha;
                const gradient = ctx.createRadialGradient(
                    x + TILE_SIZE / 2, y + TILE_SIZE / 2, 2,
                    x + TILE_SIZE / 2, y + TILE_SIZE / 2, TILE_SIZE * 0.72
                );
                gradient.addColorStop(0, '#fffbd1');
                gradient.addColorStop(0.32, '#ffcc00');
                gradient.addColorStop(0.72, '#ff6b00');
                gradient.addColorStop(1, 'rgba(255, 0, 127, 0)');
                ctx.fillStyle = gradient;
                ctx.shadowBlur = 28;
                ctx.shadowColor = '#ff007f';
                ctx.fillRect(x - 5, y - 5, TILE_SIZE + 10, TILE_SIZE + 10);

                ctx.strokeStyle = `rgba(255, 255, 220, ${1 - progress})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(x + TILE_SIZE / 2, y + TILE_SIZE / 2, TILE_SIZE * (0.18 + progress * 0.48), 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        class Powerup {
            constructor(col, row, type) {
                this.col = col;
                this.row = row;
                this.type = type; // bomb, flame, speed, shield
                this.phase = Math.random() * Math.PI * 2;
            }
            update(dt) {
                this.phase += dt * 4;
            }
            draw(ctx) {
                let x = (this.col + 0.5) * TILE_SIZE;
                let y = (this.row + 0.5) * TILE_SIZE + Math.sin(this.phase) * 3;

                ctx.save();
                ctx.translate(x, y);

                let color = '#ffffff';
                let icon = '⚡';
                if (this.type === POWERUP_BOMB) { color = '#ff007f'; icon = '💣'; }
                else if (this.type === POWERUP_FLAME) { color = '#ffaa00'; icon = '🔥'; }
                else if (this.type === POWERUP_SPEED) { color = '#00f3ff'; icon = '⚡'; }
                else if (this.type === POWERUP_SHIELD) { color = '#a855f7'; icon = '🛡️'; }

                ctx.strokeStyle = color;
                ctx.globalAlpha = 0.42;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, TILE_SIZE * (0.38 + Math.sin(this.phase) * 0.04), 0, Math.PI * 2);
                ctx.stroke();
                ctx.globalAlpha = 1;
                ctx.fillStyle = color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                ctx.beginPath();
                ctx.arc(0, 0, TILE_SIZE * 0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = '16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(icon, 0, 0);

                ctx.restore();
            }
        }

        function initGrid() {
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                grid[r] = [];
                for (let c = 0; c < COLS; c++) {
                    // Outer border & Grid pillars
                    if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1 || (r % 2 === 0 && c % 2 === 0)) {
                        grid[r][c] = TILE_WALL;
                    } else {
                        // Keep player spawn area safe (top-left 3x3)
                        if ((r <= 2 && c <= 2)) {
                            grid[r][c] = TILE_EMPTY;
                        } else {
                            // 65% chance of destructible brick
                            grid[r][c] = Math.random() < 0.65 ? TILE_BRICK : TILE_EMPTY;
                        }
                    }
                }
            }
        }

        function spawnEnemies() {
            enemies = [];
            let count = 2 + level; // Increase enemies per level
            let attempts = 0;

            while (enemies.length < count && attempts < 200) {
                attempts++;
                let c = Math.floor(Math.random() * (COLS - 2)) + 1;
                let r = Math.floor(Math.random() * (ROWS - 2)) + 1;

                // Don't spawn near player
                if (c <= 3 && r <= 3) continue;

                if (grid[r][c] === TILE_EMPTY && !enemies.some(enemy => enemy.getTile().col === c && enemy.getTile().row === r)) {
                    let type = 'basic';
                    if (level >= 2 && Math.random() < 0.3) type = 'fast';
                    if (level >= 3 && Math.random() < 0.2) type = 'ghost';
                    enemies.push(new Enemy(c, r, type));
                }
            }
        }

        function startNewGame() {
            score = 0;
            level = 1;
            lives = 3;
            startLevel();
        }

        function startLevel() {
            const inheritedUpgrades = player && level > 1 ? {
                maxBombs: player.maxBombs,
                flameRange: player.flameRange,
                speed: player.speed,
                hasShield: player.hasShield
            } : null;

            initGrid();
            player = new Player();
            if (inheritedUpgrades) Object.assign(player, inheritedUpgrades);
            spawnEnemies();
            bombs = [];
            explosions = [];
            powerups = [];
            particles = [];
            floatingTexts = [];
            combo = 0;
            comboTimer = 0;
            gameState = 'PLAYING';
            emitBurst(player.x, player.y, '#00f3ff', 18, { speed: 150, size: 3, life: 0.55, gravity: 15 });
            updateHUD();
            document.getElementById('modal-overlay').classList.add('hidden');
            document.querySelector('#btn-start span').innerText = 'ابدأ اللعب الآن';
        }

        function updateHUD() {
            document.getElementById('hud-lives').innerText = lives;
            document.getElementById('hud-score').innerText = String(score).padStart(4, '0');
            document.getElementById('hud-level').innerText = `المستوى ${level}`;
        }

        function getBombBlastTiles(col, row, range) {
            const blast = new Set([`${col},${row}`]);
            const directions = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];

            directions.forEach(direction => {
                for (let distance = 1; distance <= range; distance++) {
                    const nextCol = col + direction.x * distance;
                    const nextRow = row + direction.y * distance;
                    if (nextCol < 0 || nextCol >= COLS || nextRow < 0 || nextRow >= ROWS) break;
                    const tile = grid[nextRow][nextCol];
                    if (tile === TILE_WALL) break;
                    blast.add(`${nextCol},${nextRow}`);
                    if (tile === TILE_BRICK) break;
                }
            });

            return blast;
        }

        function findSafeEscapeTile(startCol, startRow, range) {
            const unsafeTiles = getBombBlastTiles(startCol, startRow, range);
            const visited = new Set([`${startCol},${startRow}`]);
            const queue = [{ col: startCol, row: startRow }];
            const directions = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];

            while (queue.length > 0) {
                const current = queue.shift();
                const currentKey = `${current.col},${current.row}`;
                if (!unsafeTiles.has(currentKey) && grid[current.row][current.col] === TILE_EMPTY) {
                    return current;
                }

                directions.forEach(direction => {
                    const nextCol = current.col + direction.x;
                    const nextRow = current.row + direction.y;
                    const nextKey = `${nextCol},${nextRow}`;
                    if (nextCol < 0 || nextCol >= COLS || nextRow < 0 || nextRow >= ROWS || visited.has(nextKey)) return;
                    if (grid[nextRow][nextCol] !== TILE_EMPTY) return;
                    if (bombs.some(bomb => bomb.col === nextCol && bomb.row === nextRow)) return;
                    if (enemies.some(enemy => enemy.getTile().col === nextCol && enemy.getTile().row === nextRow)) return;
                    visited.add(nextKey);
                    queue.push({ col: nextCol, row: nextRow });
                });
            }

            return null;
        }

        const keys = {};

        window.addEventListener('keydown', e => {
            audio.init();
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
            keys[e.code] = true;
            if (e.code === 'Space' && gameState === 'PLAYING' && !e.repeat) {
                tryPlaceBomb();
            }
        });

        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        function tryPlaceBomb() {
            if (!player || gameState !== 'PLAYING') return;

            let tile = player.getTile();
            // Check current active bombs placed by player
            let activeBombs = bombs.filter(b => b.owner === player).length;
            if (activeBombs >= player.maxBombs) return;

            // Check if a bomb already exists on this tile
            if (bombs.some(b => b.col === tile.col && b.row === tile.row)) return;

            bombs.push(new Bomb(tile.col, tile.row, player.flameRange, player));
            player.autoEscapeTarget = findSafeEscapeTile(tile.col, tile.row, player.flameRange);
            // Give the automatic escape route enough time to clear the blast path.
            player.bombSafetyTimer = 2.65;
            emitBurst((tile.col + 0.5) * TILE_SIZE, (tile.row + 0.5) * TILE_SIZE, '#ff007f', 7, {
                speed: 65,
                size: 2.4,
                life: 0.3,
                gravity: 0
            });
            audio.sfxPlantBomb();
        }

        // Pointer controls work for touch, pen, and desktop test devices.
        const bindHoldBtn = (id, code) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const release = (e) => {
                e.preventDefault();
                keys[code] = false;
            };
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                audio.init();
                btn.setPointerCapture?.(e.pointerId);
                keys[code] = true;
            });
            ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(eventName => btn.addEventListener(eventName, release));
        };

        bindHoldBtn('btn-up', 'ArrowUp');
        bindHoldBtn('btn-down', 'ArrowDown');
        bindHoldBtn('btn-left', 'ArrowLeft');
        bindHoldBtn('btn-right', 'ArrowRight');

        document.getElementById('btn-bomb').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            audio.init();
            tryPlaceBomb();
        });

        window.addEventListener('pointerup', () => {
            ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].forEach(code => { keys[code] = false; });
        });

        document.getElementById('btn-start').addEventListener('click', () => {
            audio.init();
            if (gameState === 'GAMEOVER' || gameState === 'WIN_ALL') {
                startNewGame();
            } else if (gameState === 'LEVEL_WIN') {
                level++;
                startLevel();
            } else {
                startNewGame();
            }
        });

        function triggerExplosion(bomb) {
            audio.playExplosion();
            screenShake = Math.max(screenShake, 18);
            addImpactFlash('#fff1b0', 0.78);
            emitBurst((bomb.col + 0.5) * TILE_SIZE, (bomb.row + 0.5) * TILE_SIZE, '#ffcc00', 20, {
                speed: 220,
                size: 3.5,
                life: 0.55,
                gravity: 35
            });

            let blastTiles = [{ col: bomb.col, row: bomb.row }];
            const dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];

            dirs.forEach(d => {
                for (let i = 1; i <= bomb.range; i++) {
                    let c = bomb.col + d.x * i;
                    let r = bomb.row + d.y * i;

                    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) break;

                    let tile = grid[r][c];

                    if (tile === TILE_WALL) {
                        break; // Blocked by wall
                    }

                    blastTiles.push({ col: c, row: r });

                    if (tile === TILE_BRICK) {
                        grid[r][c] = TILE_EMPTY; // Destroy brick
                        score += 10;
                        addFloatingText((c + 0.5) * TILE_SIZE, (r + 0.5) * TILE_SIZE, '+10', '#ffaa00');
                        emitBurst((c + 0.5) * TILE_SIZE, (r + 0.5) * TILE_SIZE, '#ff007f', 8, {
                            speed: 115,
                            size: 2.4,
                            life: 0.4,
                            gravity: 25
                        });

                        // Spawn powerup chance (25%)
                        if (Math.random() < 0.25) {
                            let types = [POWERUP_BOMB, POWERUP_FLAME, POWERUP_SPEED, POWERUP_SHIELD];
                            let pType = types[Math.floor(Math.random() * types.length)];
                            powerups.push(new Powerup(c, r, pType));
                        }
                        break; // Stop blast ray after destroying brick
                    }

                    // Chain reaction: explode other bombs immediately
                    let otherBomb = bombs.find(b => b.col === c && b.row === r);
                    if (otherBomb) {
                        otherBomb.timer = 0;
                    }
                }
            });

            // Create explosion cell objects
            blastTiles.forEach(bt => {
                explosions.push(new ExplosionCell(bt.col, bt.row));
            });

            updateHUD();
        }

        let lastTime = performance.now();

        function damagePlayer() {
            if (!player || player.invincibleTimer > 0 || gameState !== 'PLAYING') return;

            if (player.hasShield) {
                player.hasShield = false;
                player.invincibleTimer = 1.5;
                emitBurst(player.x, player.y, '#00f3ff', 18, { speed: 150, size: 3, life: 0.45, gravity: 0 });
                addImpactFlash('#00f3ff', 0.48);
            } else {
                lives = Math.max(0, lives - 1);
                player.invincibleTimer = 2.0;
                emitBurst(player.x, player.y, '#ff007f', 24, { speed: 175, size: 3.2, life: 0.6, gravity: 45 });
                addImpactFlash('#ff007f', 0.62);
                if (lives > 0) player.resetPosition();
            }

            audio.sfxHit();
            updateHUD();
            if (lives <= 0) gameOver();
        }

        function updateGame(now) {
            let dt = (now - lastTime) / 1000;
            if (dt > 0.05) dt = 0.05; // Cap long frames without making movement frame-rate dependent.
            lastTime = now;
            ambientTime += dt;
            screenShake = Math.max(0, screenShake - dt * 38);
            screenFlash = Math.max(0, screenFlash - dt * 3.4);
            if (comboTimer > 0) {
                comboTimer -= dt;
                if (comboTimer <= 0) combo = 0;
            }
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].life -= dt;
                floatingTexts[i].y -= 28 * dt;
                if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
            }

            if (gameState !== 'PLAYING') return;

            // 1. Update Player
            player.update(keys, dt);
            let pTile = player.getTile();

            // 2. Update Bombs
            for (let i = bombs.length - 1; i >= 0; i--) {
                if (bombs[i].update(dt)) {
                    let b = bombs[i];
                    bombs.splice(i, 1);
                    triggerExplosion(b);
                }
            }

            // 3. Update Explosions & Damage
            for (let i = explosions.length - 1; i >= 0; i--) {
                let ex = explosions[i];

                // Damage Player once per hit window, even when several blast cells overlap.
                if (pTile.col === ex.col && pTile.row === ex.row && player.bombSafetyTimer <= 0) {
                    damagePlayer();
                    if (gameState !== 'PLAYING') break;
                }

                // Destroy Enemies
                for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
                    let en = enemies[eIdx];
                    let eTile = en.getTile();
                    if (eTile.col === ex.col && eTile.row === ex.row) {
                        // Spawn death particles
                        for (let p = 0; p < 15; p++) {
                            particles.push(new Particle(en.x, en.y, en.color));
                        }
                        enemies.splice(eIdx, 1);
                        score += 100;
                        combo += 1;
                        comboTimer = 2.2;
                        addFloatingText(en.x, en.y, combo > 1 ? `+100  COMBO x${combo}` : '+100', en.color);
                        emitBurst(en.x, en.y, en.color, 20, { speed: 190, size: 3, life: 0.65, gravity: 40 });
                        addImpactFlash(en.color, 0.18);
                        updateHUD();
                    }
                }

                if (ex.update(dt)) {
                    explosions.splice(i, 1);
                }
            }

            // 4. Update Enemies
            enemies.forEach(en => {
                en.update(dt);
                // Touch player collision
                let dist = Math.hypot(en.x - player.x, en.y - player.y);
                if (dist < (en.radius + player.radius)) damagePlayer();
            });

            // Check Level Victory only while the player is still alive.
            if (gameState === 'PLAYING' && enemies.length === 0) {
                levelWin();
            }

            // 5. Powerups Pickup
            powerups.forEach(powerup => powerup.update(dt));
            for (let i = powerups.length - 1; i >= 0; i--) {
                let pu = powerups[i];
                if (pTile.col === pu.col && pTile.row === pu.row) {
                    if (pu.type === POWERUP_BOMB) player.maxBombs++;
                    else if (pu.type === POWERUP_FLAME) player.flameRange++;
                    else if (pu.type === POWERUP_SPEED) player.speed = Math.min(player.speed + 35, 340);
                    else if (pu.type === POWERUP_SHIELD) player.hasShield = true;

                    audio.sfxPowerup();
                    score += 50;
                    addFloatingText((pu.col + 0.5) * TILE_SIZE, (pu.row + 0.5) * TILE_SIZE, '+50', '#00f3ff');
                    emitBurst((pu.col + 0.5) * TILE_SIZE, (pu.row + 0.5) * TILE_SIZE, '#00f3ff', 16, {
                        speed: 130,
                        size: 2.8,
                        life: 0.5,
                        gravity: 0
                    });
                    addImpactFlash('#00f3ff', 0.22);
                    updateHUD();
                    powerups.splice(i, 1);
                }
            }

            // 6. Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt);
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

        }

        function gameOver() {
            gameState = 'GAMEOVER';
            addImpactFlash('#ff007f', 0.8);
            document.querySelector('#btn-start span').innerText = 'حاول مرة أخرى';
            showModal('خسارة السايبورغ!', 'تم تدميرك بواسطة النواة! حاول مرة أخرى.', 'fa-skull-crossbones', 'text-pink-500');
        }

        function levelWin() {
            gameState = 'LEVEL_WIN';
            audio.sfxWin();
            addImpactFlash('#ffcc00', 0.7);
            emitBurst(player.x, player.y, '#ffcc00', 28, { speed: 200, size: 3, life: 0.8, gravity: 18 });
            document.querySelector('#btn-start span').innerText = 'المستوى التالي';
            showModal(`أحسنت! أكملت المستوى ${level}`, 'تم تطهير القطاع بالكامل. جاهز للمستوى التالي؟', 'fa-award', 'text-yellow-400');
        }

        function showModal(title, msg, iconClass, iconColor) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('modal-icon').className = `text-6xl ${iconColor} animate-bounce`;
            document.getElementById('modal-icon').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }

        function drawArenaBackground() {
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#0b1026');
            gradient.addColorStop(0.48, '#05060d');
            gradient.addColorStop(1, '#16071b');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.globalAlpha = 0.42;
            for (let i = 0; i < 20; i++) {
                const x = (i * 83 + 31) % canvas.width;
                const y = (i * 47 + ambientTime * (8 + (i % 3) * 5)) % canvas.height;
                ctx.fillStyle = i % 2 ? '#00f3ff' : '#ff007f';
                ctx.fillRect(x, y, i % 3 === 0 ? 2 : 1, i % 3 === 0 ? 2 : 1);
            }
            ctx.globalAlpha = 0.12;
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 1;
            for (let y = 0; y < canvas.height; y += TILE_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y + 0.5);
                ctx.lineTo(canvas.width, y + 0.5);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawEffectsOverlay() {
            if (screenFlash > 0) {
                ctx.save();
                ctx.globalAlpha = Math.min(0.48, screenFlash * 0.48);
                ctx.fillStyle = screenFlashColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }

            ctx.save();
            ctx.globalAlpha = 0.06;
            ctx.fillStyle = '#ffffff';
            for (let y = (ambientTime * 24) % 6; y < canvas.height; y += 6) {
                ctx.fillRect(0, y, canvas.width, 1);
            }
            const vignette = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.height * 0.22, canvas.width / 2, canvas.height / 2, canvas.height * 0.82);
            vignette.addColorStop(0, 'rgba(0,0,0,0)');
            vignette.addColorStop(1, 'rgba(0,0,0,0.55)');
            ctx.globalAlpha = 1;
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (combo > 1 && comboTimer > 0) {
                ctx.fillStyle = '#ffcc00';
                ctx.font = '900 18px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ff007f';
                ctx.fillText(`COMBO x${combo}`, canvas.width / 2, 24);
            }
            ctx.restore();
        }

        function render() {
            ctx.save();

            // Apply camera shake effect
            if (screenShake > 0) {
                let rx = (Math.random() - 0.5) * screenShake;
                let ry = (Math.random() - 0.5) * screenShake;
                ctx.translate(rx, ry);
            }

            // Animated cyberpunk arena backdrop.
            drawArenaBackground();

            // Draw Grid Cells safely
            if (grid && grid.length === ROWS) {
                for (let r = 0; r < ROWS; r++) {
                    if (!grid[r]) continue;
                    for (let c = 0; c < COLS; c++) {
                        let x = c * TILE_SIZE;
                        let y = r * TILE_SIZE;
                        let tile = grid[r][c];

                        if (tile === TILE_WALL) {
                            // Indestructible titanium pillar with a moving neon edge.
                            const wallGradient = ctx.createLinearGradient(x, y, x + TILE_SIZE, y + TILE_SIZE);
                            wallGradient.addColorStop(0, '#16213b');
                            wallGradient.addColorStop(1, '#070b18');
                            ctx.fillStyle = wallGradient;
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                            ctx.strokeStyle = 'rgba(0, 243, 255, 0.75)';
                            ctx.shadowBlur = 8;
                            ctx.shadowColor = '#00f3ff';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                            ctx.shadowBlur = 0;
                            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                            ctx.strokeRect(x + 8, y + 8, TILE_SIZE - 16, TILE_SIZE - 16);
                        } else if (tile === TILE_BRICK) {
                            // Destructible cyber crate with a bright inner frame.
                            const brickGradient = ctx.createLinearGradient(x, y, x, y + TILE_SIZE);
                            brickGradient.addColorStop(0, '#3a1b5c');
                            brickGradient.addColorStop(1, '#171338');
                            ctx.fillStyle = brickGradient;
                            ctx.fillRect(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                            ctx.strokeStyle = 'rgba(255, 0, 127, 0.9)';
                            ctx.shadowBlur = 8;
                            ctx.shadowColor = '#ff007f';
                            ctx.lineWidth = 1.5;
                            ctx.strokeRect(x + 4, y + 4, TILE_SIZE - 8, TILE_SIZE - 8);
                            ctx.shadowBlur = 0;
                            ctx.strokeStyle = 'rgba(255, 204, 0, 0.22)';
                            ctx.beginPath();
                            ctx.moveTo(x + 9, y + 9);
                            ctx.lineTo(x + TILE_SIZE - 9, y + TILE_SIZE - 9);
                            ctx.moveTo(x + TILE_SIZE - 9, y + 9);
                            ctx.lineTo(x + 9, y + TILE_SIZE - 9);
                            ctx.stroke();
                        } else {
                            // Floor grid lines.
                            ctx.strokeStyle = 'rgba(0, 243, 255, 0.08)';
                            ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
                        }
                    }
                }
            }

            // Draw entities. Explosions are rendered over actors so the impact reads clearly.
            powerups.forEach(pu => pu.draw(ctx));
            bombs.forEach(b => b.draw(ctx));
            enemies.forEach(en => en.draw(ctx));
            if (player) player.draw(ctx);
            explosions.forEach(ex => ex.draw(ctx));
            particles.forEach(p => p.draw(ctx));

            floatingTexts.forEach(item => {
                const alpha = Math.max(0, item.life / item.maxLife);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = item.color;
                ctx.font = '900 14px Tajawal, sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 10;
                ctx.shadowColor = item.color;
                ctx.fillText(item.text, item.x, item.y);
                ctx.restore();
            });

            ctx.restore();
            drawEffectsOverlay();
        }

        // Main Animation Frame Loop
        function gameLoop(now) {
            updateGame(now);
            render();
            requestAnimationFrame(gameLoop);
        }

        // Initial setup for background grid before game start
        initGrid();

        // Start Loop
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
